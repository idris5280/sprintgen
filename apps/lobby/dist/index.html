<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scrum Studio Lobby creates a screen-shareable meeting lobby with countdowns, weather, trivia, and ceremony handoffs."
    />
    <title>Scrum Studio Lobby</title>
    <script>
      (() => {
        const STORAGE_KEYS = [
          "scrum-studio-lobby-config-v2",
          "scrum-studio-lobby-config-v1",
          "scrum-lobby-config-v3",
        ];

        for (const key of STORAGE_KEYS) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) continue;
            const config = JSON.parse(raw);
            if (config && config.musicSource?.type !== "none") {
              config.musicSource = { type: "none" };
              localStorage.setItem(key, JSON.stringify(config));
            }
          } catch {
            // Ignore malformed local settings and let the app continue loading.
          }
        }

        const normalizeLobbyUi = () => {
          const startInput = document.getElementById("startTime");
          if (startInput) {
            const label = document.querySelector('label[for="startTime"]');
            if (label && label.textContent === "Meeting start time") {
              label.textContent = "Meeting start time (optional)";
            }

            if (
              !startInput.value &&
              !document.querySelector("[data-five-minute-fallback-note]")
            ) {
              const note = document.createElement("p");
              note.dataset.fiveMinuteFallbackNote = "true";
              note.className = "text-xs text-muted-foreground";
              note.textContent =
                "Leave blank to open the lobby with a 5-minute countdown.";
              startInput.insertAdjacentElement("afterend", note);
            }
          }
        };

        window.addEventListener("DOMContentLoaded", () => {
          normalizeLobbyUi();
          new MutationObserver(normalizeLobbyUi).observe(document.body, {
            childList: true,
            subtree: true,
          });
        });
      })();
    </script>
    <script type="module" crossorigin src="/lobby/assets/index-q96PvbWb.js"></script>
    <link rel="stylesheet" crossorigin href="/lobby/assets/index-CUxXBb30.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
