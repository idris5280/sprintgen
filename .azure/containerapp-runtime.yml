location: eastus
name: sprintgen
resourceGroup: sprintgen-rg
type: Microsoft.App/containerApps
properties:
  managedEnvironmentId: /subscriptions/0ddd4042-9bd9-4115-9539-f853a03608c0/resourceGroups/sprintgen-rg/providers/Microsoft.App/managedEnvironments/sprintgen-env
  workloadProfileName: Consumption
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 3000
      transport: Auto
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: sprintgen
        image: mcr.microsoft.com/playwright:v1.60.0-noble
        command:
          - /bin/sh
        args:
          - -lc
          - |
            set -e
            mkdir -p /tmp/sprintgen-app
            cd /tmp/sprintgen-app
            curl -fsSL https://github.com/idris5280/sprintgen/archive/refs/heads/main.tar.gz -o source.tar.gz
            tar --strip-components=1 -xzf source.tar.gz
            npm ci --omit=dev
            npm start
        env:
          - name: NODE_ENV
            value: production
          - name: PORT
            value: "3000"
        resources:
          cpu: 1.0
          memory: 2.0Gi
    scale:
      minReplicas: 1
      maxReplicas: 1
